<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CR 出勤表</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:      #f5f5f5;
  --accent:  #edff90;
  --accent2: #c6fca2;
  --accent3: #9ef985;
  --cream:   #ffffe9;
  --white:   #ffffff;
  --dark:    #1a1a1a;
  --fg:      #111111;
  --muted:   #666666;
  --line:    #4d4d4d;
  --grid:    #d6d6d6;
  --radius:  8px;
  --r-sm:    5px;
  /* 狀態顏色 */
  --st-leave:  #edff90;  /* 特休、大特 */
  --st-home:   #d6ecff;  /* 在宅 */
  --st-sick:   #ffd9d3;  /* 病假、事假、健檢… */
  --st-event:  #c6fca2;  /* 員旅、公假、婚假 */
  --st-other:  #e9e9e9;
  --font: 'Noto Sans TC', 'Segoe UI', system-ui, sans-serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  font-size: 13px;
  font-weight: 300;
  background: var(--bg);
  color: var(--fg);
  padding: 14px 16px 24px;
}
button { font-family: inherit; }
.wrap { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

/* ── 頁首 ── */
.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
}
.back { color: var(--muted); text-decoration: none; font-size: 12px; }
.back:hover { color: var(--fg); text-decoration: underline; }
h1 { font-size: 20px; font-weight: 900; letter-spacing: .02em; }
.spacer { flex: 1; }
.btn {
  border: 1px solid var(--line); background: var(--white); color: var(--fg);
  border-radius: var(--r-sm); padding: 5px 12px; font-size: 12px; cursor: pointer;
}
.btn:hover { filter: brightness(.95); }
.btn.primary { background: var(--accent3); font-weight: 700; }
.btn:disabled { opacity: .5; cursor: default; }
.who { font-size: 12px; color: var(--muted); }
.badge {
  display: inline-block; border-radius: 20px; padding: 2px 9px; font-size: 11px;
  border: 1px solid var(--line); margin-left: 6px;
}
.badge.edit { background: var(--accent3); }
.badge.ro   { background: var(--white); color: var(--muted); border-color: #bbb; }

/* ── 月份列 ── */
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  background: var(--white); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 8px 12px;
}
.month { display: flex; align-items: center; gap: 6px; }
.month strong { font-size: 15px; font-weight: 700; min-width: 108px; text-align: center; }
.nav {
  width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--white); cursor: pointer; font-size: 14px; line-height: 1;
}
.nav:hover { background: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 11px; color: #444; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,.25); display: inline-block; }
.status-msg { font-size: 12px; color: var(--muted); }

/* ── 表格 ── */
.grid-wrap {
  background: var(--white); border: 1px solid var(--line); border-radius: var(--radius);
  overflow: auto; max-height: calc(100vh - 170px);
}
table { border-collapse: separate; border-spacing: 0; font-size: 11px; }
th, td { border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); }
thead th {
  position: sticky; top: 0; z-index: 2; background: #fafafa;
  font-weight: 700; padding: 4px 0; min-width: 46px; text-align: center; line-height: 1.25;
}
thead th small { display: block; font-weight: 400; color: var(--muted); font-size: 10px; }
thead th.off { background: #ececec; color: #888; }
thead th.today { background: var(--accent); color: var(--fg); }
th.name, td.name {
  position: sticky; left: 0; z-index: 1; background: var(--white);
  text-align: left; padding: 0 10px; min-width: 104px; white-space: nowrap;
  border-right: 1px solid var(--line);
}
thead th.name { z-index: 3; background: #fafafa; }
td.name b { font-weight: 700; font-size: 12px; }
tr.team td {
  background: var(--cream); font-weight: 700; font-size: 11px; color: #444;
  padding: 3px 10px; border-bottom: 1px solid var(--line);
}
tr.team td.name { background: var(--cream); }
td.cell { padding: 0; height: 30px; min-width: 46px; }
td.cell.off { background: #f1f1f1; }
td.cell.today { box-shadow: inset 2px 0 0 #b9c94a, inset -2px 0 0 #b9c94a; }
.cell button {
  width: 100%; height: 30px; border: 0; background: transparent; cursor: default;
  font-size: 11px; line-height: 1.1; padding: 0 2px; color: var(--fg);
  display: flex; align-items: center; justify-content: center; text-align: center;
  word-break: break-all;
}
.can-edit .cell button { cursor: pointer; }
.can-edit .cell button:hover { outline: 2px solid var(--line); outline-offset: -2px; }
.cell button:focus-visible { outline: 2px dashed var(--line); outline-offset: -3px; }
.cell button.saving { opacity: .45; }
.s-leave { background: var(--st-leave) !important; }
.s-home  { background: var(--st-home)  !important; }
.s-sick  { background: var(--st-sick)  !important; }
.s-event { background: var(--st-event) !important; }
.s-other { background: var(--st-other) !important; }

/* ── 對話框 ── */
dialog {
  border: 1px solid var(--line); border-radius: 12px; padding: 20px 20px 16px;
  width: min(380px, calc(100vw - 32px)); margin: auto;
  box-shadow: 0 10px 34px rgba(0,0,0,.2); font-family: var(--font);
}
dialog::backdrop { background: rgba(0,0,0,.4); }
.dlg-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.dlg-sub { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip {
  border: 1px solid var(--line); border-radius: 20px; padding: 5px 12px;
  font-size: 12px; cursor: pointer; background: var(--white);
}
.chip:hover { filter: brightness(.94); }
.chip.on { outline: 2px solid var(--fg); outline-offset: 1px; font-weight: 700; }
.row { display: flex; gap: 6px; margin-bottom: 12px; }
.row input {
  flex: 1; border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: 6px 9px; font-family: inherit; font-size: 13px;
}
.dlg-actions { display: flex; justify-content: space-between; gap: 8px; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; font-size: 12px; color: #444; }
.field input {
  border: 1px solid var(--line); border-radius: var(--r-sm); padding: 7px 9px;
  font-family: inherit; font-size: 13px;
}
.err { color: #b3261e; font-size: 12px; min-height: 16px; margin-bottom: 8px; }

/* ── 提示 ── */
.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
  background: var(--dark); color: #fff; border-radius: 20px; padding: 8px 16px;
  font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .2s;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <a class="back" href="./">← 回 CR Portal</a>
    <h1>CR 出勤表</h1>
    <div class="spacer"></div>
    <span class="who" id="who">未登入（唯讀）</span>
    <button class="btn" id="authBtn">登入編輯</button>
  </div>

  <div class="bar">
    <div class="month">
      <button class="nav" id="prevM" aria-label="上個月">‹</button>
      <strong id="monthLabel">----</strong>
      <button class="nav" id="nextM" aria-label="下個月">›</button>
      <button class="btn" id="todayBtn">本月</button>
    </div>
    <div class="legend">
      <span><i style="background:var(--st-leave)"></i>特休／大特</span>
      <span><i style="background:var(--st-home)"></i>在宅</span>
      <span><i style="background:var(--st-sick)"></i>病假／事假／健檢</span>
      <span><i style="background:var(--st-event)"></i>員旅／公假／婚假</span>
      <span><i style="background:#f1f1f1"></i>假日</span>
    </div>
    <div class="spacer"></div>
    <span class="status-msg" id="loadMsg"></span>
  </div>

  <div class="grid-wrap" id="gridWrap"></div>
</div>

<!-- 修改出勤 -->
<dialog id="editDlg">
  <div class="dlg-title" id="editTitle"></div>
  <div class="dlg-sub" id="editSub">選擇狀態，或輸入自訂內容</div>
  <div class="chips" id="chips"></div>
  <div class="row">
    <input id="customInput" placeholder="自訂，例如：上特休/下在宅" maxlength="30">
    <button class="btn primary" id="customSave">儲存</button>
  </div>
  <div class="dlg-actions">
    <button class="btn" id="clearBtn">清除（正常出勤）</button>
    <button class="btn" id="cancelBtn">取消</button>
  </div>
</dialog>

<!-- 登入 -->
<dialog id="loginDlg">
  <form id="loginForm" method="dialog">
    <div class="dlg-title">登入編輯出勤</div>
    <div class="dlg-sub">使用 CR 大表（Creative）的帳號密碼</div>
    <label class="field">Email<input type="email" id="loginEmail" autocomplete="username" required></label>
    <label class="field">密碼<input type="password" id="loginPw" autocomplete="current-password" required></label>
    <div class="err" id="loginErr"></div>
    <div class="dlg-actions">
      <button type="button" class="btn" id="loginCancel">取消</button>
      <button type="submit" class="btn primary" id="loginSubmit">登入</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
// ───────── 設定 ─────────
const SUPABASE_URL = 'https://xlmjrmdrwoiljzfofoze.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XAKmhxWEdlfxNAnX0eL79w_KquN6YP9';

// 成員與隊伍（順序 = 表格順序；名字要和資料庫裡的 member 一致，用大寫）
const TEAMS = [
  { team: '',     members: ['CHOCO', 'HOWARD'] },
  { team: '花花隊', members: ['IKA', 'HUNGLING', 'ANDY', 'SHERRY', 'WEN', 'KUAN'] },
  { team: '泡泡隊', members: ['WEIYU', 'SANA', 'EMERY', 'NEKO', 'JIKA', 'YAYA', 'RISHONA'] },
  { team: '啾啾隊', members: ['EMMA', 'MAE', 'DALORA', 'ICHIGO'] },
  { team: '毛毛隊', members: ['BERNIE', 'IVAN', 'JOY', 'TZ', 'ZOE'] },
];

// 常用狀態（彈窗裡的按鈕）
const STATUSES = ['在宅', '特休', '特休(上)', '特休(下)', '大特', '病假', '病假(上)', '病假(下)',
                  '事假', '事假(上)', '公假', '健檢', '員旅', '婚假', '生理假', '颱風在宅'];

// 國定假日（每年更新）
const HOLIDAYS = {
  '2026-01-01': '元旦',
  '2026-02-14': '春節', '2026-02-15': '春節', '2026-02-16': '春節', '2026-02-17': '春節',
  '2026-02-18': '春節', '2026-02-19': '春節', '2026-02-20': '春節', '2026-02-21': '春節', '2026-02-22': '春節',
  '2026-02-27': '228', '2026-04-03': '清明', '2026-04-06': '清明',
  '2026-05-01': '勞動節', '2026-06-19': '端午節', '2026-09-25': '中秋節', '2026-09-28': '教師節',
  '2026-10-09': '雙十節', '2026-10-26': '光復節', '2026-12-25': '行憲紀念日',
};

// ───────── 工具 ─────────
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function statusClass(s) {
  if (!s) return '';
  if (/特休|大特/.test(s)) return 's-leave';
  if (/在宅/.test(s)) return 's-home';
  if (/病|事假|健檢|生理/.test(s)) return 's-sick';
  if (/員旅|公假|婚假|喪假|產假/.test(s)) return 's-event';
  return 's-other';
}

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

// ───────── 狀態 ─────────
const now = new Date();
let viewY = now.getFullYear(), viewM = now.getMonth();   // viewM: 0-11
let data = {};          // key: 'YYYY-MM-DD|MEMBER' → status
let canEdit = false;
let editing = null;     // { date, member }

// ───────── 登入 ─────────
async function refreshAuth() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    canEdit = false;
    $('who').textContent = '未登入（唯讀）';
    $('authBtn').textContent = '登入編輯';
  } else {
    const email = session.user.email || '';
    const { data: ok, error } = await sb.rpc('is_cr_attendance_editor');
    canEdit = !error && ok === true;
    $('who').innerHTML = esc(email) + (canEdit
      ? '<span class="badge edit">可編輯</span>'
      : '<span class="badge ro">唯讀</span>');
    $('authBtn').textContent = '登出';
  }
  document.body.classList.toggle('can-edit', canEdit);
}

$('authBtn').addEventListener('click', async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    await sb.auth.signOut();
    await refreshAuth();
    toast('已登出');
  } else {
    $('loginErr').textContent = '';
    $('loginDlg').showModal();
    $('loginEmail').focus();
  }
});
$('loginCancel').addEventListener('click', () => $('loginDlg').close());
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('loginSubmit').disabled = true;
  $('loginErr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({
    email: $('loginEmail').value.trim(),
    password: $('loginPw').value,
  });
  $('loginSubmit').disabled = false;
  if (error) { $('loginErr').textContent = '登入失敗：帳號或密碼錯誤'; return; }
  $('loginPw').value = '';
  $('loginDlg').close();
  await refreshAuth();
  toast(canEdit ? '登入成功，可以編輯了' : '已登入，但這個帳號沒有編輯權限');
});

// ───────── 讀資料 ─────────
async function loadMonth() {
  const first = new Date(viewY, viewM, 1);
  const last = new Date(viewY, viewM + 1, 0);
  $('monthLabel').textContent = viewY + ' 年 ' + (viewM + 1) + ' 月';
  $('loadMsg').textContent = '載入中…';
  data = {};
  const { data: rows, error } = await sb
    .from('cr_attendance')
    .select('work_date,member,status')
    .gte('work_date', ymd(first))
    .lte('work_date', ymd(last));
  if (error) {
    $('loadMsg').textContent = '資料載入失敗';
  } else {
    rows.forEach(r => { data[r.work_date + '|' + r.member] = r.status; });
    $('loadMsg').textContent = '';
  }
  render();
}

// ───────── 畫表格 ─────────
function render() {
  const days = new Date(viewY, viewM + 1, 0).getDate();
  const today = ymd(new Date());
  const cols = [];
  for (let d = 1; d <= days; d++) {
    const dt = new Date(viewY, viewM, d);
    const key = ymd(dt);
    const wk = dt.getDay();
    cols.push({ key, d, wk, off: wk === 0 || wk === 6 || !!HOLIDAYS[key], today: key === today });
  }

  let h = '<table><thead><tr><th class="name">成員</th>';
  cols.forEach(c => {
    const cls = [c.off ? 'off' : '', c.today ? 'today' : ''].join(' ');
    const title = HOLIDAYS[c.key] ? ' title="' + esc(HOLIDAYS[c.key]) + '"' : '';
    h += '<th class="' + cls + '"' + title + '>' + c.d + '<small>' + WEEK[c.wk] + '</small></th>';
  });
  h += '</tr></thead><tbody>';

  TEAMS.forEach(g => {
    if (g.team) h += '<tr class="team"><td class="name">' + esc(g.team) + '</td><td colspan="' + cols.length + '"></td></tr>';
    g.members.forEach(m => {
      h += '<tr><td class="name"><b>' + esc(m) + '</b></td>';
      cols.forEach(c => {
        const s = data[c.key + '|' + m] || '';
        const cls = ['cell', c.off ? 'off' : '', c.today ? 'today' : ''].join(' ');
        h += '<td class="' + cls + '"><button class="' + statusClass(s) + '" data-d="' + c.key + '" data-m="' + esc(m) + '"'
          + ' aria-label="' + esc(m + ' ' + c.key + ' ' + (s || '正常出勤')) + '">' + esc(s) + '</button></td>';
      });
      h += '</tr>';
    });
  });
  h += '</tbody></table>';
  $('gridWrap').innerHTML = h;

  // 捲到今天
  const t = $('gridWrap').querySelector('th.today');
  if (t) $('gridWrap').scrollLeft = Math.max(0, t.offsetLeft - 200);
}

// ───────── 編輯 ─────────
$('gridWrap').addEventListener('click', e => {
  const b = e.target.closest('.cell button');
  if (!b) return;
  if (!canEdit) { toast('請先登入有編輯權限的帳號'); return; }
  editing = { date: b.dataset.d, member: b.dataset.m };
  const cur = data[editing.date + '|' + editing.member] || '';
  const dt = new Date(editing.date + 'T00:00:00');
  $('editTitle').textContent = editing.member + ' · ' + (dt.getMonth() + 1) + '/' + dt.getDate() + '（' + WEEK[dt.getDay()] + '）';
  $('editSub').textContent = cur ? '目前：' + cur : '目前：正常出勤';
  $('chips').innerHTML = STATUSES.map(s =>
    '<button type="button" class="chip ' + statusClass(s) + (s === cur ? ' on' : '') + '" data-s="' + esc(s) + '">' + esc(s) + '</button>'
  ).join('');
  $('customInput').value = STATUSES.includes(cur) ? '' : cur;
  $('editDlg').showModal();
});

$('chips').addEventListener('click', e => {
  const c = e.target.closest('.chip');
  if (c) save(c.dataset.s);
});
$('customSave').addEventListener('click', () => {
  const v = $('customInput').value.trim();
  if (!v) { toast('請輸入內容，或按「清除」'); return; }
  save(v);
});
$('customInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('customSave').click(); });
$('clearBtn').addEventListener('click', () => save(''));
$('cancelBtn').addEventListener('click', () => $('editDlg').close());

async function save(status) {
  if (!editing) return;
  const { date, member } = editing;
  const key = date + '|' + member;
  const prev = data[key] || '';
  $('editDlg').close();
  if (status === prev) return;

  // 先更新畫面，失敗再還原
  if (status) data[key] = status; else delete data[key];
  render();
  const btn = $('gridWrap').querySelector('button[data-d="' + date + '"][data-m="' + CSS.escape(member) + '"]');
  if (btn) btn.classList.add('saving');

  const { error } = status
    ? await sb.from('cr_attendance').upsert({ work_date: date, member, status, updated_at: new Date().toISOString() })
    : await sb.from('cr_attendance').delete().eq('work_date', date).eq('member', member);

  if (error) {
    if (prev) data[key] = prev; else delete data[key];
    render();
    toast('儲存失敗：' + (error.message || '請重新登入再試'));
  } else {
    if (btn) btn.classList.remove('saving');
    toast(status ? member + ' 已設為「' + status + '」' : member + ' 已清除');
  }
}

// ───────── 月份切換 ─────────
$('prevM').addEventListener('click', () => { viewM--; if (viewM < 0) { viewM = 11; viewY--; } loadMonth(); });
$('nextM').addEventListener('click', () => { viewM++; if (viewM > 11) { viewM = 0; viewY++; } loadMonth(); });
$('todayBtn').addEventListener('click', () => { viewY = now.getFullYear(); viewM = now.getMonth(); loadMonth(); });

// ───────── 啟動 ─────────
// 不能在這個 callback 裡直接 await Supabase 呼叫，所以延後執行
sb.auth.onAuthStateChange(() => { setTimeout(refreshAuth, 0); });
refreshAuth().then(loadMonth);
</script>
</body>
</html>
