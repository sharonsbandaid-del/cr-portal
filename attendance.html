<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CR 出勤表</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:      #f5f5f5;
  --accent:  #edff90;
  --accent2: #c6fca2;
  --accent3: #9ef985;
  --cream:   #ffffe9;
  --white:   #ffffff;
  --dark:    #1a1a1a;
  --fg:      #111111;
  --muted:   #666666;
  --line:    #4d4d4d;
  --grid:    #d6d6d6;
  --radius:  8px;
  --r-sm:    5px;
  /* 狀態顏色 */
  --st-leave:  #edff90;  /* 特休、大特 */
  --st-home:   #d6ecff;  /* 在宅 */
  --st-sick:   #ffd9d3;  /* 病假、事假、健檢… */
  --st-event:  #c6fca2;  /* 員旅、公假、婚假 */
  --st-other:  #e9e9e9;
  --font: 'Noto Sans TC', 'Segoe UI', system-ui, sans-serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  font-size: 13px;
  font-weight: 300;
  background: var(--bg);
  color: var(--fg);
  padding: 14px 16px 24px;
}
button { font-family: inherit; }
.wrap { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
body:not(.authed) .wrap { visibility: hidden; }

/* ── 頁首 ── */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.back { color: var(--muted); text-decoration: none; font-size: 12px; }
.back:hover { color: var(--fg); text-decoration: underline; }
h1 { font-size: 20px; font-weight: 900; letter-spacing: .02em; }
.spacer { flex: 1; }
.btn {
  border: 1px solid var(--line); background: var(--white); color: var(--fg);
  border-radius: var(--r-sm); padding: 5px 12px; font-size: 12px; cursor: pointer;
}
.btn:hover { filter: brightness(.95); }
.btn.primary { background: var(--accent3); font-weight: 700; }
.btn:disabled { opacity: .5; cursor: default; }
.who { font-size: 12px; color: var(--muted); }

/* ── 月份列 ── */
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  background: var(--white); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 8px 12px;
}
.month { display: flex; align-items: center; gap: 6px; }
.month strong { font-size: 15px; font-weight: 700; min-width: 108px; text-align: center; }
.nav {
  width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--white); cursor: pointer; font-size: 14px; line-height: 1;
}
.nav:hover { background: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 11px; color: #444; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,.25); display: inline-block; }
.legend .half {
  display: inline-block;
  width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,.25);
  background: linear-gradient(var(--st-leave) 50%, var(--st-home) 50%);
}
.status-msg { font-size: 12px; color: var(--muted); }

/* ── 表格 ── */
.grid-wrap {
  background: var(--white); border: 1px solid var(--line); border-radius: var(--radius);
  overflow: auto; max-height: calc(100vh - 170px);
}
table { border-collapse: separate; border-spacing: 0; font-size: 11px; }
th, td { border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); }
thead th {
  position: sticky; top: 0; z-index: 2; background: #fafafa;
  font-weight: 700; padding: 4px 0; min-width: 50px; text-align: center; line-height: 1.25;
}
thead th small { display: block; font-weight: 400; color: var(--muted); font-size: 10px; }
thead th.off { background: #ececec; color: #888; }
thead th.today { background: var(--accent); color: var(--fg); }
th.name, td.name {
  position: sticky; left: 0; z-index: 1; background: var(--white);
  text-align: left; padding: 0 10px; min-width: 104px; white-space: nowrap;
  border-right: 1px solid var(--line);
}
thead th.name { z-index: 3; background: #fafafa; }
td.name b { font-weight: 700; font-size: 12px; }
td.name.me b::after { content: '（我）'; font-weight: 400; color: var(--muted); font-size: 10px; }
tr.team td {
  background: var(--cream); font-weight: 700; font-size: 11px; color: #444;
  padding: 3px 10px; border-bottom: 1px solid var(--line);
}
tr.team td.name { background: var(--cream); }
td.cell { padding: 0; height: 36px; min-width: 50px; }
td.cell.off { background: #f1f1f1; }
td.cell.today { box-shadow: inset 2px 0 0 #b9c94a, inset -2px 0 0 #b9c94a; }
.cell button {
  width: 100%; height: 36px; border: 0; background: transparent; cursor: pointer;
  font-size: 11px; line-height: 1.1; padding: 0; color: var(--fg);
  display: flex; flex-direction: column; align-items: stretch; justify-content: stretch;
}
body.can-edit .cell button:hover { outline: 2px solid var(--line); outline-offset: -2px; }
body:not(.can-edit) .cell button { cursor: default; }
.cell button:focus-visible { outline: 2px dashed var(--line); outline-offset: -3px; }
.cell button.saving { opacity: .45; }
.cell .full, .cell .h {
  flex: 1; display: flex; align-items: center; justify-content: center;
  text-align: center; word-break: break-all; padding: 0 2px; min-height: 0;
}
.cell .h { font-size: 10px; }
.cell .h + .h { border-top: 1px dashed rgba(0,0,0,.18); }
.s-leave { background: var(--st-leave); }
.s-home  { background: var(--st-home); }
.s-sick  { background: var(--st-sick); }
.s-event { background: var(--st-event); }
.s-other { background: var(--st-other); }

/* ── 對話框 ── */
dialog {
  border: 1px solid var(--line); border-radius: 12px; padding: 20px 20px 16px;
  width: min(440px, calc(100vw - 24px)); margin: auto; max-height: calc(100vh - 24px);
  box-shadow: 0 10px 34px rgba(0,0,0,.2); font-family: var(--font);
}
dialog::backdrop { background: rgba(0,0,0,.4); }
.dlg-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.dlg-sub { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.seg {
  display: inline-flex; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; margin-bottom: 12px;
}
.seg button {
  border: 0; background: var(--white); padding: 6px 16px; font-size: 13px; cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--dark); color: #fff; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip {
  border: 1px solid var(--line); border-radius: 20px; padding: 5px 12px;
  font-size: 12px; cursor: pointer; background: var(--white);
}
.chip:hover { filter: brightness(.94); }
.chip.normal { background: var(--white); border-style: dashed; }
.chip.on { outline: 2px solid var(--fg); outline-offset: 1px; font-weight: 700; }
.row { display: flex; gap: 6px; margin-bottom: 12px; }
.row input {
  flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: 6px 9px; font-family: inherit; font-size: 13px;
}
.preview {
  display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center;
  background: #fafafa; border: 1px solid var(--grid); border-radius: var(--r-sm);
  padding: 8px 10px; margin-bottom: 12px; font-size: 12px;
}
.preview b { font-weight: 700; color: #444; }
.pv { border-radius: 4px; padding: 2px 8px; justify-self: start; }
.meta { font-size: 11px; color: var(--muted); margin-bottom: 12px; }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; font-size: 12px; color: #444; }
.field input {
  border: 1px solid var(--line); border-radius: var(--r-sm); padding: 7px 9px;
  font-family: inherit; font-size: 13px;
}
.err { color: #b3261e; font-size: 12px; min-height: 16px; margin-bottom: 8px; }

/* ── 登入 ── */
.login-gate {
  position: fixed; inset: 0; z-index: 100; background: var(--bg);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.login-gate[hidden] { display: none; }
.login-box {
  background: var(--white); border: 1px solid var(--line); border-radius: 12px;
  width: min(360px, 100%); padding: 26px 24px 22px;
}
.login-box h2 { font-size: 18px; font-weight: 900; margin-bottom: 4px; }
.login-box p { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
.login-box .btn.primary { width: 100%; padding: 8px; font-size: 13px; }

/* ── 提示 ── */
.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
  background: var(--dark); color: #fff; border-radius: 20px; padding: 8px 16px;
  font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 200;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="login-gate" id="loginGate" hidden>
  <form class="login-box" id="loginForm">
    <h2>CR大平台</h2>
    <p>請用 CR 大表（Creative）的帳號密碼登入</p>
    <label class="field">Email<input type="email" id="loginEmail" autocomplete="username" required></label>
    <label class="field">密碼<input type="password" id="loginPw" autocomplete="current-password" required></label>
    <div class="err" id="loginErr"></div>
    <button type="submit" class="btn primary" id="loginSubmit">登入</button>
  </form>
</div>

<div class="wrap">

  <div class="top">
    <a class="back" href="https://sharonsbandaid-del.github.io/cr-portal/">← 回 CR大平台</a>
    <h1>CR 出勤表</h1>
    <div class="spacer"></div>
    <span class="who" id="who"></span>
    <button class="btn" id="logoutBtn">登出</button>
  </div>

  <div class="bar">
    <div class="month">
      <button class="nav" id="prevM" aria-label="上個月">‹</button>
      <strong id="monthLabel">----</strong>
      <button class="nav" id="nextM" aria-label="下個月">›</button>
      <button class="btn" id="todayBtn">本月</button>
    </div>
    <div class="legend">
      <span><i style="background:var(--st-leave)"></i>特休／大特</span>
      <span><i style="background:var(--st-home)"></i>在宅</span>
      <span><i style="background:var(--st-sick)"></i>病假／事假／健檢</span>
      <span><i style="background:var(--st-event)"></i>員旅／公假／婚假</span>
      <span><i style="background:#f1f1f1"></i>假日</span>
      <span><b class="half"></b>上下半天不同（上格＝上午）</span>
    </div>
    <div class="spacer"></div>
    <span class="status-msg" id="loadMsg"></span>
  </div>

  <div class="grid-wrap" id="gridWrap"></div>
</div>

<!-- 修改出勤 -->
<dialog id="editDlg">
  <div class="dlg-title" id="editTitle"></div>
  <div class="dlg-sub">先選「整天／上午／下午」，再點狀態</div>
  <div class="seg" id="seg">
    <button type="button" data-t="all" class="on">整天</button>
    <button type="button" data-t="am">上午</button>
    <button type="button" data-t="pm">下午</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="row">
    <input id="customInput" placeholder="其他狀態，自己輸入" maxlength="20">
    <button class="btn" id="customApply">套用</button>
  </div>
  <div class="preview">
    <b>上午</b><span class="pv" id="pvAm"></span>
    <b>下午</b><span class="pv" id="pvPm"></span>
  </div>
  <div class="meta" id="editMeta"></div>
  <div class="dlg-actions">
    <button class="btn" id="cancelBtn">取消</button>
    <button class="btn primary" id="saveBtn">儲存</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
// ───────── 設定 ─────────
const SUPABASE_URL = 'https://xlmjrmdrwoiljzfofoze.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XAKmhxWEdlfxNAnX0eL79w_KquN6YP9';

// 彈窗裡的狀態按鈕
const STATUSES = ['特休', '大特', '在宅', '病假', '事假', '公假', '健檢', '員旅', '婚假', '生理假', '喪假', '颱風在宅'];

// 國定假日（每年底補下一年）
const HOLIDAYS = {
  '2026-01-01': '元旦',
  '2026-02-14': '春節', '2026-02-15': '春節', '2026-02-16': '春節', '2026-02-17': '春節',
  '2026-02-18': '春節', '2026-02-19': '春節', '2026-02-20': '春節', '2026-02-21': '春節', '2026-02-22': '春節',
  '2026-02-27': '228', '2026-04-03': '清明', '2026-04-06': '清明',
  '2026-05-01': '勞動節', '2026-06-19': '端午節', '2026-09-25': '中秋節', '2026-09-28': '教師節',
  '2026-10-09': '雙十節', '2026-10-26': '光復節', '2026-12-25': '行憲紀念日',
};

// ───────── 工具 ─────────
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function statusClass(s) {
  if (!s) return '';
  if (/特休|大特/.test(s)) return 's-leave';
  if (/在宅/.test(s)) return 's-home';
  if (/病|事假|健檢|生理/.test(s)) return 's-sick';
  if (/員旅|公假|婚假|喪假|產假/.test(s)) return 's-event';
  return 's-other';
}

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

// ───────── 狀態 ─────────
const now = new Date();
let viewY = now.getFullYear(), viewM = now.getMonth();
let members = [];       // [{name, team}]
let myName = '';
let data = {};          // 'YYYY-MM-DD|NAME' → {am, pm, updated_by, updated_at}
let editing = null;     // {date, member, am, pm, target}
let canEdit = false;

// ───────── 登入 ─────────
function showLogin(msg) {
  document.body.classList.remove('authed');
  $('loginErr').textContent = msg || '';
  $('loginGate').hidden = false;
  setTimeout(() => $('loginEmail').focus(), 0);
}

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { showLogin(); return; }
  const email = (session.user.email || '').toLowerCase();

  const { data: rows, error } = await sb.from('cr_members')
    .select('name,team,email,sort_order').eq('active', true).order('sort_order');
  const me = (rows || []).find(m => (m.email || '').toLowerCase() === email);
  if (error) { showLogin('資料載入失敗，請重新登入'); return; }
  members = rows || [];
  canEdit = !!me;                       // 只有 CR 成員能編輯，其他人唯讀
  myName = me ? me.name : '';
  $('who').textContent = (me ? me.name + '・' : '') + email + (canEdit ? '' : '（唯讀）');
  $('loginGate').hidden = true;
  document.body.classList.add('authed');
  document.body.classList.toggle('can-edit', canEdit);
  await loadMonth();
}

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('loginSubmit').disabled = true;
  $('loginErr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({
    email: $('loginEmail').value.trim(),
    password: $('loginPw').value,
  });
  $('loginSubmit').disabled = false;
  if (error) { $('loginErr').textContent = '登入失敗：帳號或密碼錯誤'; return; }
  $('loginPw').value = '';
  start();
});
$('logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

// ───────── 讀資料 ─────────
async function loadMonth() {
  const first = new Date(viewY, viewM, 1);
  const last = new Date(viewY, viewM + 1, 0);
  $('monthLabel').textContent = viewY + ' 年 ' + (viewM + 1) + ' 月';
  $('loadMsg').textContent = '載入中…';
  data = {};
  const { data: rows, error } = await sb.from('cr_attendance')
    .select('work_date,member,am,pm,updated_by,updated_at')
    .gte('work_date', ymd(first)).lte('work_date', ymd(last));
  if (error) {
    $('loadMsg').textContent = '資料載入失敗，請重新整理';
  } else {
    rows.forEach(r => { data[r.work_date + '|' + r.member] = r; });
    $('loadMsg').textContent = '';
  }
  render();
}

// ───────── 畫表格 ─────────
function cellInner(rec) {
  if (!rec || (!rec.am && !rec.pm)) return '';
  if (rec.am === rec.pm) return '<span class="full ' + statusClass(rec.am) + '">' + esc(rec.am) + '</span>';
  return '<span class="h ' + statusClass(rec.am) + '">' + esc(rec.am || '') + '</span>'
       + '<span class="h ' + statusClass(rec.pm) + '">' + esc(rec.pm || '') + '</span>';
}
function cellLabel(m, key, rec) {
  if (!rec || (!rec.am && !rec.pm)) return m + ' ' + key + ' 正常出勤';
  if (rec.am === rec.pm) return m + ' ' + key + ' 整天' + rec.am;
  return m + ' ' + key + ' 上午' + (rec.am || '正常') + '，下午' + (rec.pm || '正常');
}

function render() {
  const days = new Date(viewY, viewM + 1, 0).getDate();
  const today = ymd(new Date());
  const cols = [];
  for (let d = 1; d <= days; d++) {
    const dt = new Date(viewY, viewM, d);
    const key = ymd(dt);
    const wk = dt.getDay();
    cols.push({ key, d, wk, off: wk === 0 || wk === 6 || !!HOLIDAYS[key], today: key === today });
  }

  let h = '<table><thead><tr><th class="name">成員</th>';
  cols.forEach(c => {
    const cls = [c.off ? 'off' : '', c.today ? 'today' : ''].join(' ');
    const title = HOLIDAYS[c.key] ? ' title="' + esc(HOLIDAYS[c.key]) + '"' : '';
    h += '<th class="' + cls + '"' + title + '>' + c.d + '<small>' + WEEK[c.wk] + '</small></th>';
  });
  h += '</tr></thead><tbody>';

  let lastTeam;
  members.forEach(m => {
    if (m.team && m.team !== lastTeam) {
      h += '<tr class="team"><td class="name">' + esc(m.team) + '</td><td colspan="' + cols.length + '"></td></tr>';
    }
    lastTeam = m.team;
    h += '<tr><td class="name' + (m.name === myName ? ' me' : '') + '"><b>' + esc(m.name) + '</b></td>';
    cols.forEach(c => {
      const rec = data[c.key + '|' + m.name];
      const cls = ['cell', c.off ? 'off' : '', c.today ? 'today' : ''].join(' ');
      h += '<td class="' + cls + '"><button data-d="' + c.key + '" data-m="' + esc(m.name) + '"'
        + ' aria-label="' + esc(cellLabel(m.name, c.key, rec)) + '">' + cellInner(rec) + '</button></td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table>';
  const wrap = $('gridWrap');
  const keepX = wrap.scrollLeft, keepY = wrap.scrollTop;
  wrap.innerHTML = h;
  wrap.scrollLeft = keepX;
  wrap.scrollTop = keepY;
}

function scrollToToday() {
  const t = $('gridWrap').querySelector('th.today');
  if (t) $('gridWrap').scrollLeft = Math.max(0, t.offsetLeft - 200);
}

// ───────── 編輯 ─────────
function setTarget(t) {
  editing.target = t;
  $('seg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  drawChips();
}
function currentForTarget() {
  if (editing.target === 'am') return editing.am;
  if (editing.target === 'pm') return editing.pm;
  return editing.am === editing.pm ? editing.am : undefined;
}
function drawChips() {
  const cur = currentForTarget();
  $('chips').innerHTML =
    '<button type="button" class="chip normal' + (cur === null ? ' on' : '') + '" data-s="">正常出勤</button>' +
    STATUSES.map(s => '<button type="button" class="chip ' + statusClass(s) + (s === cur ? ' on' : '') + '" data-s="' + esc(s) + '">' + esc(s) + '</button>').join('');
  const pv = (el, v) => { el.textContent = v || '正常出勤'; el.className = 'pv ' + statusClass(v); };
  pv($('pvAm'), editing.am);
  pv($('pvPm'), editing.pm);
}
function applyStatus(s) {
  const v = s || null;
  if (editing.target === 'all' || editing.target === 'am') editing.am = v;
  if (editing.target === 'all' || editing.target === 'pm') editing.pm = v;
  drawChips();
}

$('gridWrap').addEventListener('click', e => {
  const b = e.target.closest('.cell button');
  if (!b) return;
  if (!canEdit) { toast('只有 CR 成員可以修改出勤'); return; }
  const rec = data[b.dataset.d + '|' + b.dataset.m];
  editing = { date: b.dataset.d, member: b.dataset.m, am: rec?.am || null, pm: rec?.pm || null, orig: rec };
  const dt = new Date(editing.date + 'T00:00:00');
  $('editTitle').textContent = editing.member + ' · ' + (dt.getMonth() + 1) + '/' + dt.getDate() + '（' + WEEK[dt.getDay()] + '）';
  $('editMeta').textContent = rec?.updated_by
    ? '最後修改：' + rec.updated_by + '，' + new Date(rec.updated_at).toLocaleString('zh-TW', { hour12: false })
    : '';
  $('customInput').value = '';
  setTarget(rec && rec.am !== rec.pm ? 'am' : 'all');
  $('editDlg').showModal();
});

$('seg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTarget(b.dataset.t); });
$('chips').addEventListener('click', e => { const c = e.target.closest('.chip'); if (c) applyStatus(c.dataset.s); });
$('customApply').addEventListener('click', () => {
  const v = $('customInput').value.trim();
  if (!v) { toast('請先輸入狀態'); return; }
  applyStatus(v);
  $('customInput').value = '';
});
$('customInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('customApply').click(); } });
$('cancelBtn').addEventListener('click', () => $('editDlg').close());
$('saveBtn').addEventListener('click', save);

async function save() {
  const { date, member, am, pm, orig } = editing;
  $('editDlg').close();
  if ((orig?.am || null) === am && (orig?.pm || null) === pm) return;

  const key = date + '|' + member;
  if (am || pm) data[key] = { ...(orig || {}), work_date: date, member, am, pm };
  else delete data[key];
  render();
  const btn = $('gridWrap').querySelector('button[data-d="' + date + '"][data-m="' + CSS.escape(member) + '"]');
  if (btn) btn.classList.add('saving');

  const res = (am || pm)
    ? await sb.from('cr_attendance').upsert({ work_date: date, member, am, pm }).select('work_date,member,am,pm,updated_by,updated_at').single()
    : await sb.from('cr_attendance').delete().eq('work_date', date).eq('member', member);

  if (res.error) {
    if (orig) data[key] = orig; else delete data[key];
    render();
    toast('儲存失敗：' + (res.error.message || '請重新登入再試'));
    return;
  }
  if (res.data) data[key] = res.data;
  render();
  const desc = !am && !pm ? '正常出勤' : am === pm ? am : '上午' + (am || '正常') + '／下午' + (pm || '正常');
  toast(member + ' ' + (date.slice(5).replace('-', '/')) + ' → ' + desc);
}

// ───────── 月份切換 ─────────
$('prevM').addEventListener('click', () => { viewM--; if (viewM < 0) { viewM = 11; viewY--; } loadMonth(); });
$('nextM').addEventListener('click', () => { viewM++; if (viewM > 11) { viewM = 0; viewY++; } loadMonth(); });
$('todayBtn').addEventListener('click', () => { viewY = now.getFullYear(); viewM = now.getMonth(); loadMonth().then(scrollToToday); });

// ───────── 啟動 ─────────
start().then(scrollToToday);
</script>
</body>
